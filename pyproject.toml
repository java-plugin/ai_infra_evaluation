[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-infra-advisor"
version = "0.1.0"
description = "A verifiable decision engine for AI infrastructure: MFU, KV Cache, memory, TCO, and a tool-using agent."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Infra Advisor Contributors" }]
keywords = ["ai-infra", "gpu", "tco", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "reportlab>=4.1",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "playwright>=1.44",
]
charts = ["matplotlib>=3.8", "seaborn>=0.13"]
docs = ["mkdocs-material>=9.5"]
# 从原书 PDF 抽取语料时需要；只在本机执行 `ai-infra rag extract`，产出已提交的派生语料
rag-extract = ["pdfplumber>=0.11"]

[project.scripts]
ai-infra = "ai_infra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_infra"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S308"]
# 计算器使用公式中的物理量记号（N、L、S、B、H_kv 等），保留原公式可读性
"src/ai_infra/calculators/*" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "reportlab"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
